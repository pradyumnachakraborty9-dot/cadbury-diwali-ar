<!DOCTYPE html>
<!--
  ============================================================
  CADBURY CELEBRATIONS – DIWALI WebAR CAMPAIGN (single file)
  ============================================================

  HOW TO TEST (Hiro marker):
  1. Host this file over HTTPS (camera access requires it on iOS Safari
     and Chrome Android). Easy options: GitHub Pages, Netlify Drop,
     Vercel, or `npx serve` with an https tunnel (e.g. ngrok).
     (http://localhost also works for desktop testing.)
  2. Open the page on your phone and tap "Allow" for camera access.
  3. Show the HIRO marker to the camera. Either:
       - Print it: https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png
       - Or open that URL on a second screen (laptop/tablet) at
         medium brightness and point your phone at it.
     Keep the marker's black border fully visible, flat and well lit.
  4. The gift box appears on the marker. Tap the floating gold labels
     (Family Wish / Neighbor Wish / Special Offer) to open the modal.
  5. Use the bottom buttons to open the lid or share on WhatsApp.

  Demo/prototype note: replace "CADBURY10" and share copy with the
  approved campaign content before going live.
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cadbury Celebrations – Diwali AR Gift</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Verified CDN dependencies (order matters: A-Frame first, then AR.js) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    :root {
      --purple: #47008C;
      --purple-dark: #2d0059;
      --gold: #D4AF37;
      --gold-light: #f3d97a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* AR.js injects video + canvas; make sure they fill the screen */
    .a-canvas { width: 100% !important; height: 100% !important; }
    video#arjs-video {
      position: fixed !important; top: 0; left: 0;
      width: 100% !important; height: 100% !important;
      object-fit: cover; z-index: -2;
    }

    /* ---------- 2D UI OVERLAY (above AR view) ---------- */
    #ui {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none; /* taps pass through to the 3D scene */
    }

    /* Top banner */
    #banner {
      position: absolute; top: 0; left: 0; right: 0;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
      background: linear-gradient(135deg, var(--purple-dark), var(--purple));
      color: #fff; text-align: center;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    #banner .brand {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 2px;
    }
    #banner h1 {
      margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .5px;
    }

    /* Scan hint */
    #hint {
      position: absolute; top: 112px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); color: #fff; padding: 8px 16px;
      border-radius: 999px; font-size: 13px; white-space: nowrap;
      transition: opacity .5s ease;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #hint.hidden { opacity: 0; }

    /* Bottom actions */
    #actions {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
      display: flex; flex-direction: column; gap: 10px;
      background: linear-gradient(to top, rgba(0,0,0,.6), transparent);
    }
    .btn {
      pointer-events: auto; cursor: pointer; border: none;
      padding: 15px 18px; font-size: 16px; font-weight: 700;
      border-radius: 14px; width: 100%;
      transition: transform .12s ease, box-shadow .12s ease;
      font-family: inherit;
    }
    .btn:active { transform: scale(.97); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: var(--purple-dark);
      box-shadow: 0 6px 18px rgba(212,175,55,.45);
    }
    .btn-whatsapp {
      background: #25D366; color: #fff;
      box-shadow: 0 6px 18px rgba(37,211,102,.4);
    }

    /* ---------- GLASSMORPHISM MODAL ---------- */
    #modal {
      position: fixed; inset: 0; z-index: 20;
      display: none; align-items: center; justify-content: center;
      padding: 24px; background: rgba(20, 0, 40, .35);
      pointer-events: auto;
    }
    #modal.show { display: flex; animation: fadeIn .25s ease; }
    .glass {
      width: 100%; max-width: 360px; text-align: center;
      padding: 30px 24px 24px; border-radius: 24px; color: #fff;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.4);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      animation: popIn .3s cubic-bezier(.2,1.2,.4,1);
    }
    .glass .tag {
      display: inline-block; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold-light);
      margin-bottom: 10px; font-weight: 700;
    }
    .glass p {
      font-size: 20px; line-height: 1.45; margin: 0 0 22px; font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    #closeModal {
      pointer-events: auto; cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff; border: 1px solid var(--gold);
      padding: 12px 34px; border-radius: 999px;
      font-size: 15px; font-weight: 700; font-family: inherit;
    }
    #closeModal:active { transform: scale(.96); }

    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes popIn  { from { opacity: 0; transform: scale(.85) translateY(10px) } to { opacity: 1; transform: none } }
  </style>
</head>

<body>
  <!-- ============ 3D / AR SCENE ============ -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true; antialias: true;"
    gesture-detector="false"
    id="scene">

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; color: #fff4d6; intensity: 0.9" position="1 3 2"></a-entity>

    <!-- Hiro marker: all content is parented here, so it tracks the marker -->
    <a-marker preset="hiro" id="marker">

      <!-- ===== GIFT BOX ===== -->
      <a-box position="0 0.25 0" depth="1" height="0.5" width="1.2" color="#47008C"
             material="roughness: 0.3; metalness: 0.2"></a-box>

      <!-- Gold ribbon around base (decorative) -->
      <a-box position="0 0.25 0" depth="1.02" height="0.52" width="0.12" color="#D4AF37"
             material="metalness: 0.6; roughness: 0.3"></a-box>

      <!-- Lid (animated by "Open Gift Box" button) -->
      <a-box id="boxLid" position="0 0.52 0" depth="1.05" height="0.1" width="1.25" color="#D4AF37"
             material="metalness: 0.5; roughness: 0.35"></a-box>

      <!-- Chocolates peeking out (spheres + cubes) -->
      <a-sphere position="-0.3 0.48 0.1" radius="0.12" color="#5a2d0c" material="roughness:0.2; metalness:0.3"></a-sphere>
      <a-box position="0.0 0.46 -0.1" width="0.2" height="0.14" depth="0.2" color="#3b1c07" rotation="0 25 0"></a-box>
      <a-sphere position="0.3 0.48 0.12" radius="0.12" color="#7b3f12" material="roughness:0.2; metalness:0.3"></a-sphere>
      <a-box position="0.1 0.46 0.25" width="0.16" height="0.12" depth="0.16" color="#D4AF37" rotation="0 -20 0"></a-box>
      <a-sphere position="-0.15 0.46 -0.25" radius="0.1" color="#47008C"></a-sphere>

      <!-- Scattered chocolates around the box -->
      <a-sphere position="-0.85 0.1 0.7" radius="0.1" color="#5a2d0c"></a-sphere>
      <a-box position="0.9 0.08 0.75" width="0.16" height="0.16" depth="0.16" color="#7b3f12" rotation="0 30 0"></a-box>
      <a-sphere position="0.85 0.09 -0.8" radius="0.09" color="#D4AF37" material="metalness:0.6"></a-sphere>
      <a-box position="-0.9 0.08 -0.75" width="0.15" height="0.15" depth="0.15" color="#47008C" rotation="0 -35 0"></a-box>

      <!-- ===== DIYAS (clay base + glowing flame + light) ===== -->
      <!-- Diya 1 -->
      <a-entity position="-0.85 0 0.0">
        <a-cylinder radius="0.13" height="0.06" position="0 0.03" color="#b5651d"></a-cylinder>
        <a-sphere radius="0.09" position="0 0.06" scale="1 0.5 1" color="#8b4a14"></a-sphere>
        <a-cone radius-bottom="0.04" radius-top="0" height="0.16" position="0 0.17" color="#ffb300"
                material="shader: flat; color: #ffb300"
                animation="property: scale; dir: alternate; dur: 350; loop: true; to: 1 1.25 1; easing: easeInOutSine"></a-cone>
        <a-sphere radius="0.05" position="0 0.14" color="#fff2a8" material="shader: flat; opacity: 0.8; transparent: true"></a-sphere>
        <a-entity light="type: point; color: #ffb347; intensity: 0.6; distance: 1.5" position="0 0.2 0"></a-entity>
      </a-entity>
      <!-- Diya 2 -->
      <a-entity position="0.85 0 0.0">
        <a-cylinder radius="0.13" height="0.06" position="0 0.03" color="#b5651d"></a-cylinder>
        <a-sphere radius="0.09" position="0 0.06" scale="1 0.5 1" color="#8b4a14"></a-sphere>
        <a-cone radius-bottom="0.04" radius-top="0" height="0.16" position="0 0.17" color="#ffb300"
                material="shader: flat; color: #ffb300"
                animation="property: scale; dir: alternate; dur: 420; loop: true; to: 1 1.3 1; easing: easeInOutSine"></a-cone>
        <a-sphere radius="0.05" position="0 0.14" color="#fff2a8" material="shader: flat; opacity: 0.8; transparent: true"></a-sphere>
        <a-entity light="type: point; color: #ffb347; intensity: 0.6; distance: 1.5" position="0 0.2 0"></a-entity>
      </a-entity>
      <!-- Diya 3 -->
      <a-entity position="0 0 0.95">
        <a-cylinder radius="0.13" height="0.06" position="0 0.03" color="#b5651d"></a-cylinder>
        <a-sphere radius="0.09" position="0 0.06" scale="1 0.5 1" color="#8b4a14"></a-sphere>
        <a-cone radius-bottom="0.04" radius-top="0" height="0.16" position="0 0.17" color="#ffb300"
                material="shader: flat; color: #ffb300"
                animation="property: scale; dir: alternate; dur: 380; loop: true; to: 1 1.2 1; easing: easeInOutSine"></a-cone>
        <a-sphere radius="0.05" position="0 0.14" color="#fff2a8" material="shader: flat; opacity: 0.8; transparent: true"></a-sphere>
        <a-entity light="type: point; color: #ffb347; intensity: 0.6; distance: 1.5" position="0 0.2 0"></a-entity>
      </a-entity>
      <!-- Diya 4 -->
      <a-entity position="0 0 -0.95">
        <a-cylinder radius="0.13" height="0.06" position="0 0.03" color="#b5651d"></a-cylinder>
        <a-sphere radius="0.09" position="0 0.06" scale="1 0.5 1" color="#8b4a14"></a-sphere>
        <a-cone radius-bottom="0.04" radius-top="0" height="0.16" position="0 0.17" color="#ffb300"
                material="shader: flat; color: #ffb300"
                animation="property: scale; dir: alternate; dur: 450; loop: true; to: 1 1.25 1; easing: easeInOutSine"></a-cone>
        <a-sphere radius="0.05" position="0 0.14" color="#fff2a8" material="shader: flat; opacity: 0.8; transparent: true"></a-sphere>
        <a-entity light="type: point; color: #ffb347; intensity: 0.6; distance: 1.5" position="0 0.2 0"></a-entity>
      </a-entity>

      <!-- ===== INTERACTIVE FLOATING LABELS =====
           Each has a transparent clickable backing plane (class "clickable")
           because raycasters hit geometry more reliably than text. -->

      <!-- Label 1: Family Wish -->
      <a-entity position="-1.0 1.9 0" look-at-camera
                animation="property: position; dir: alternate; dur: 1800; loop: true; to: -1.0 2.0 0; easing: easeInOutSine">
        <a-plane class="clickable" data-wish="family" width="1.1" height="0.38" color="#47008C"
                 material="opacity: 0.85; transparent: true; side: double"></a-plane>
        <a-text value="Family Wish" align="center" color="#D4AF37" width="2.2" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- Label 2: Neighbor Wish -->
      <a-entity position="0 2.4 0" look-at-camera
                animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 2.5 0; easing: easeInOutSine">
        <a-plane class="clickable" data-wish="neighbor" width="1.3" height="0.38" color="#47008C"
                 material="opacity: 0.85; transparent: true; side: double"></a-plane>
        <a-text value="Neighbor Wish" align="center" color="#D4AF37" width="2.2" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- Label 3: Special Offer -->
      <a-entity position="1.0 1.9 0" look-at-camera
                animation="property: position; dir: alternate; dur: 1600; loop: true; to: 1.0 2.0 0; easing: easeInOutSine">
        <a-plane class="clickable" data-wish="offer" width="1.1" height="0.38" color="#47008C"
                 material="opacity: 0.85; transparent: true; side: double"></a-plane>
        <a-text value="Special Offer" align="center" color="#D4AF37" width="2.2" position="0 0 0.01"></a-text>
      </a-entity>

    </a-marker>

    <!-- Camera with mouse/touch raycaster (rayOrigin: mouse works for taps on mobile) -->
    <a-entity camera>
      <a-entity cursor="rayOrigin: mouse; fuse: false"
                raycaster="objects: .clickable; far: 50"></a-entity>
    </a-entity>
  </a-scene>

  <!-- ============ 2D UI OVERLAY ============ -->
  <div id="ui">
    <div id="banner">
      <div class="brand">Cadbury Celebrations</div>
      <h1>Scan &amp; Share the Joy</h1>
    </div>

    <div id="hint">📷 Point your camera at the Hiro marker</div>

    <div id="actions">
      <button class="btn btn-gold" id="openBtn">🎁 Open Gift Box</button>
      <button class="btn btn-whatsapp" id="shareBtn">💬 Share Wish on WhatsApp</button>
    </div>
  </div>

  <!-- Glassmorphism modal -->
  <div id="modal" role="dialog" aria-modal="true">
    <div class="glass">
      <div class="tag" id="modalTag">Happy Diwali</div>
      <p id="modalText"></p>
      <button id="closeModal">Close</button>
    </div>
  </div>

  <script>
    // ---------- Custom component: labels always face the camera ----------
    AFRAME.registerComponent('look-at-camera', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const camPos = new THREE.Vector3();
        cam.getWorldPosition(camPos);
        this.el.object3D.lookAt(camPos);
      }
    });

    // ---------- Wish content ----------
    const WISHES = {
      family:   { tag: 'Family Wish',   text: 'To the family that makes every Diwali sweet! 🪔✨' },
      neighbor: { tag: 'Neighbor Wish', text: 'To the neighbors who feel like family — Happy Diwali! 🪔' },
      offer:    { tag: 'Special Offer', text: "Your Diwali Discount: Use code 'CADBURY10' for 10% off online!" }
    };

    const modal     = document.getElementById('modal');
    const modalText = document.getElementById('modalText');
    const modalTag  = document.getElementById('modalTag');

    function showModal(key) {
      const w = WISHES[key];
      if (!w) return;
      modalTag.textContent = w.tag;
      modalText.textContent = w.text;
      modal.classList.add('show');
    }
    function hideModal() { modal.classList.remove('show'); }

    document.getElementById('closeModal').addEventListener('click', hideModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) hideModal(); });

    // ---------- Wire up 3D clickables once the scene is ready ----------
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelectorAll('.clickable').forEach(function (el) {
        el.addEventListener('click', function () {
          showModal(el.getAttribute('data-wish'));
        });
      });
    });

    // ---------- Hide the hint when the marker is found ----------
    const marker = document.getElementById('marker');
    const hint   = document.getElementById('hint');
    marker.addEventListener('markerFound', () => hint.classList.add('hidden'));
    marker.addEventListener('markerLost',  () => hint.classList.remove('hidden'));

    // ---------- Open / Close gift box lid ----------
    const lid     = document.getElementById('boxLid');
    const openBtn = document.getElementById('openBtn');
    let isOpen = false;

    openBtn.addEventListener('click', function () {
      isOpen = !isOpen;
      lid.removeAttribute('animation__lid');
      lid.setAttribute('animation__lid', {
        property: 'position',
        to: isOpen ? '0 1.2 0' : '0 0.52 0',
        dur: 900,
        easing: 'easeOutElastic'
      });
      lid.setAttribute('animation__spin', {
        property: 'rotation',
        to: isOpen ? '0 25 0' : '0 0 0',
        dur: 900,
        easing: 'easeOutQuad'
      });
      openBtn.textContent = isOpen ? '📦 Close Gift Box' : '🎁 Open Gift Box';
    });

    // ---------- Share on WhatsApp ----------
    document.getElementById('shareBtn').addEventListener('click', function () {
      window.open('https://api.whatsapp.com/send?text=Happy%20Diwali!%20Check%20out%20this%20Cadbury%20Celebrations%20AR%20Gift!', '_blank');
    });
  </script>
</body>
</html>
